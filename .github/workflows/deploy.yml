name: Deploy to Contabo VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Check deploy secrets
        if: ${{ env.VPS_HOST == '' || env.VPS_SSH_KEY == '' }}
        run: echo "::warning::VPS_HOST and/or VPS_SSH_KEY secrets are not configured; skipping deploy."

      - name: Deploy via SSH to Contabo VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR=""
            if [ -d "/home/acsd.sa/public_html" ]; then
              TARGET_DIR="/home/acsd.sa/public_html"
            elif [ -d "/var/www/acsd-website" ]; then
              TARGET_DIR="/var/www/acsd-website"
            fi

            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              if [ -f "deploy.sh" ]; then
                chmod +x deploy.sh
                ./deploy.sh
              else
                git pull origin main
                pnpm install && pnpm build && (pm2 reload all || true)
              fi
            else
              echo "Error: Target directory not found on the server."
              exit 1
            fi
