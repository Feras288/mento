name: Deploy to Contabo VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Check deploy secrets
        if: ${{ env.VPS_HOST == '' || env.VPS_SSH_KEY == '' }}
        run: echo "::warning::VPS_HOST and/or VPS_SSH_KEY secrets are not configured; skipping deploy."

      - name: Deploy via SSH to Contabo VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/acsd-website
            chmod +x deploy.sh
            ./deploy.sh
